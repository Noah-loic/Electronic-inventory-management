spring.application.name=EUCL

spring.datasource.url=jdbc:mysql://localhost:3306/reg_eucl
spring.datasource.username=root
spring.datasource.password=email@gmail.com
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=eucl-inventory-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000
